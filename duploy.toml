version = 1

# Plane (community) Duploy uzerinde. Tek host, path bazli yonlendirme
# (upstream Caddy proxy'sinin karsiligi): /spaces -> space, /god-mode -> admin,
# /live -> live, /mcp -> mcp, /api, /auth, /static -> api, /uploads -> minio,
# geri kalani -> web.
#
# OAuth kesif dokumanlari ikiye ayrilir: /.well-known/oauth-protected-resource
# kaynak sunucununki (mcp), /.well-known/oauth-authorization-server yetki
# sunucununki (api). Ikisi ayni host'ta oldugu icin path ile ayrildi.
#
# Secret'lar: duploy secret set api SECRET_KEY=… LIVE_SERVER_SECRET_KEY=…
#             duploy secret set minio MINIO_ROOT_USER=… MINIO_ROOT_PASSWORD=…
#             duploy secret set mq RABBITMQ_DEFAULT_PASS=…
#             duploy secret set mcp MCP_INTROSPECTION_CLIENT_ID=… MCP_INTROSPECTION_CLIENT_SECRET=…
#
# mcp secret'lari api icinde uretilir (bkz. asagidaki [services.mcp] notu).

# ----------------------------------------------------------------- web

[services.web]
source = { path = ".", dockerfile = "apps/web/Dockerfile.web" }
port = 3000
domains = [{ host = "plane.duploy.dev", path = "/" }]
health = { http = "/" }

[services.space]
source = { path = ".", dockerfile = "apps/space/Dockerfile.space" }
port = 3000
domains = [{ host = "plane.duploy.dev", path = "/spaces" }]
health = { http = "/spaces/" }

[services.admin]
source = { path = ".", dockerfile = "apps/admin/Dockerfile.admin" }
port = 3000
domains = [{ host = "plane.duploy.dev", path = "/god-mode" }]
health = { http = "/god-mode" }

[services.live]
source = { path = ".", dockerfile = "apps/live/Dockerfile.live" }
port = 3000
domains = [{ host = "plane.duploy.dev", path = "/live" }]
health = { http = "/live/health" }
# Acik Yjs dokumanlari bellekte durur; plan varsayilani 0.5 cpu / 256M yetmiyor.
resources = { cpu = 2.0, memory = "2G" }

[services.live.env]
API_BASE_URL = "http://api:8000"
LIVE_BASE_PATH = "/live"
CORS_ALLOWED_ORIGINS = "https://plane.duploy.dev"
LIVE_SERVER_SECRET_KEY = { from_service = "api", key = "LIVE_SERVER_SECRET_KEY" }
REDIS_URL = { from_database = "redis", property = "url" }

# ----------------------------------------------------------------- mcp

# Uzak MCP sunucusu. OAuth 2.1 kaynak sunucusu; yetki sunucusu api.
# Ilk kurulumda tanitici ciftini api uretir, sonra secret olarak yazilir:
#   duploy service exec api -- python manage.py create_mcp_resource_server_client
#   duploy secret set mcp MCP_INTROSPECTION_CLIENT_ID=… MCP_INTROSPECTION_CLIENT_SECRET=…
# Secret yazilana kadar servis acilista env dogrulamasindan duser; beklenen durum.
[services.mcp]
source = { path = ".", dockerfile = "apps/mcp/Dockerfile.mcp" }
port = 3000
domains = [
  { host = "plane.duploy.dev", path = "/mcp" },
  { host = "plane.duploy.dev", path = "/.well-known/oauth-protected-resource" },
]
health = { http = "/health" }
resources = { cpu = 2.0, memory = "1G" }

[services.mcp.env]
# Kesif dokumanlarinda issuer olarak yayinlanir; tarayicinin gordugu origin ile
# birebir ayni olmak zorunda, yoksa istemci token'i reddeder.
APP_BASE_URL = "https://plane.duploy.dev"
API_INTERNAL_URL = "http://api:8000"
MCP_BASE_PATH = "/mcp"
# Token dogrulama sonucu burada paylasilir; replika sayisi artarsa her biri ayni
# onbellegi gorur. TTL kadar sure iptal edilmis token calismaya devam eder.
REDIS_URL = { from_database = "redis", property = "url" }
TOKEN_CACHE_TTL = "45"
MCP_INTROSPECTION_CLIENT_ID = { secret = true }
MCP_INTROSPECTION_CLIENT_SECRET = { secret = true }

# ----------------------------------------------------------------- api

[services.api]
source = { path = "apps/api", dockerfile = "Dockerfile.api" }
port = 8000
domains = [
  { host = "plane.duploy.dev", path = "/api" },
  { host = "plane.duploy.dev", path = "/auth" },
  { host = "plane.duploy.dev", path = "/static" },
  # RFC 8414: yetki sunucusu metadata'si. Kaynak sunucununki mcp'de.
  { host = "plane.duploy.dev", path = "/.well-known/oauth-authorization-server" },
]
# Ayri migrator container'i yok: migrasyon api acilisinda kosar (tek replika).
command = ["sh", "-c", "python manage.py migrate && exec ./bin/docker-entrypoint-api.sh"]
# Ilk kurulumda migrate dakikalar surer; saglik penceresi genis (15 s x 60).
health = { http = "/api/instances/", interval = "15s", retries = 60 }
# 2 worker'da paralel istekler (proje acilisinda ~12) kuyruga giriyor; sayfa 10 sn gec geliyordu.
# cpu acikca verilmezse plan varsayilani 0.5 cekirdek; 6 worker orada bogulur.
resources = { cpu = 4.0, memory = "2G" }

[services.api.env]
DEBUG = "0"
SECRET_KEY = { secret = true }
LIVE_SERVER_SECRET_KEY = { secret = true }
GUNICORN_WORKERS = "6"
WEB_URL = "https://plane.duploy.dev"
CORS_ALLOWED_ORIGINS = "https://plane.duploy.dev"
APP_BASE_URL = "https://plane.duploy.dev"
APP_BASE_PATH = ""
ADMIN_BASE_URL = "https://plane.duploy.dev"
ADMIN_BASE_PATH = "/god-mode"
SPACE_BASE_URL = "https://plane.duploy.dev"
SPACE_BASE_PATH = "/spaces"
LIVE_BASE_URL = "https://plane.duploy.dev"
LIVE_BASE_PATH = "/live"
DATABASE_URL = { from_database = "db", property = "url" }
REDIS_URL = { from_database = "redis", property = "url" }
RABBITMQ_HOST = "mq"
RABBITMQ_PORT = "5672"
RABBITMQ_USER = { from_service = "mq", key = "RABBITMQ_DEFAULT_USER" }
RABBITMQ_PASSWORD = { from_service = "mq", key = "RABBITMQ_DEFAULT_PASS" }
RABBITMQ_VHOST = { from_service = "mq", key = "RABBITMQ_DEFAULT_VHOST" }
USE_MINIO = "1"
AWS_REGION = ""
AWS_S3_ENDPOINT_URL = "http://minio:9000"
AWS_S3_BUCKET_NAME = "uploads"
AWS_ACCESS_KEY_ID = { from_service = "minio", key = "MINIO_ROOT_USER" }
AWS_SECRET_ACCESS_KEY = { from_service = "minio", key = "MINIO_ROOT_PASSWORD" }
FILE_SIZE_LIMIT = "5242880"
MINIO_ENDPOINT_SSL = "0"
API_KEY_RATE_LIMIT = "600/minute"
HARD_DELETE_AFTER_DAYS = "60"

[services.worker]
type = "worker"
source = { image_of = "api" }
# Entrypoint concurrency'yi cekirdek sayisina esitler (20 prefork x Django
# bellek limitini asip OOM'a dusuyordu); ayni adimlar, sabit concurrency.
command = ["sh", "-c", "python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l info --concurrency 4"]
inherit_env = "api"
resources = { cpu = 2.0, memory = "1G" }

[services.beat]
type = "worker"
source = { image_of = "api" }
command = ["./bin/docker-entrypoint-beat.sh"]
inherit_env = "api"
resources = { memory = "512M" }

# ----------------------------------------------------------------- altyapi

[services.mq]
type = "worker"
source = { image = "rabbitmq:3.13-alpine" }
health = { cmd = ["rabbitmq-diagnostics", "-q", "ping"], interval = "15s", retries = 10 }
# 256M'de watermark ~100M'ye dusuyor, RabbitMQ publish'leri bloklamaya basliyor.
resources = { memory = "1G" }

[services.mq.env]
RABBITMQ_DEFAULT_USER = "plane"
RABBITMQ_DEFAULT_PASS = { secret = true }
RABBITMQ_DEFAULT_VHOST = "plane"

[services.mq.volumes]
data = { path = "/var/lib/rabbitmq" }

[services.minio]
source = { image = "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z" }
port = 9000
domains = [{ host = "plane.duploy.dev", path = "/uploads" }]
command = ["minio", "server", "/export"]
health = { http = "/minio/health/live" }
resources = { memory = "1G" }

[services.minio.env]
MINIO_ROOT_USER = { secret = true }
MINIO_ROOT_PASSWORD = { secret = true }

[services.minio.volumes]
data = { path = "/export", size = "20G" }

# ----------------------------------------------------------------- veritabanlari

[databases.db]
engine = "postgres"
version = "18"
resources = { cpu = 2.0, memory = "2G" }

[databases.db.backup]
schedule = "0 3 * * *"
retain = 7

[databases.redis]
engine = "redis"
version = "7"
